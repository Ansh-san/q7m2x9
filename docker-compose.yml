services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windpulse_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windpulse_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
